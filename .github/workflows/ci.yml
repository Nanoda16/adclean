name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: python -m pytest tests -q

      - name: Verify non-editable wheel packaging and package-data
        shell: bash
        run: |
          python -m pip install --upgrade setuptools wheel
          mkdir -p _dist_check
          python -m pip wheel --no-deps --no-build-isolation -w _dist_check .
          python -c "
          import glob, zipfile
          wheels = glob.glob('_dist_check/*.whl')
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = [
              'adclean/static/index.html',
              'adclean/static/pywebview_bridge.js',
              'adclean/data/pinyin.tsv',
              'adclean/data/t2s.tsv',
          ]
          for req in required:
              assert req in names, f'Missing {req} in wheel: {sorted(names)[:30]}'
          print('Wheel package-data verified:', len(names), 'entries')
          "
          python -m pip install --force-reinstall --no-deps _dist_check/*.whl
          python -c "
          import os, tempfile, adclean.server, adclean.locate
          os.chdir(tempfile.gettempdir())
          assert os.path.isfile(os.path.join(adclean.server.STATIC, 'index.html'))
          assert os.path.isdir(adclean.locate.DATA_DIR)
          print('Non-editable install verified OK')
          "
